# Docker Compose for Axon
services:
  axon-api:
    build: .
    ports:
      - "8420:8420"
    volumes:
      - ./src:/app/src
      - ./chroma_data:/app/chroma_data
      - ./bm25_index:/app/bm25_index
      - ./config.yaml:/app/config.yaml
    environment:
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - path: .env
        required: false
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Local Dockerized Ollama Engine
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
